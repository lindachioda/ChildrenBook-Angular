<!-- Page Header-->
        <app-header-form [text]="text" (search)="searchBooks($event)"></app-header-form>
        <!-- Main Content-->
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5">
                <!--Search list-->
                <div class="col-sm-6 border-radius mb-3">
                    <app-search-list [text]="text" [books]="books" [active]="active" (setActive)="setActive($event)"></app-search-list>
                </div>
                <!--feedback and cart-->
                <div class="col-sm-6">
                    <!--Info book-->
                    <app-info-book [active]="active" [items]="cartService.items" (addToCart)="addToCart($event)"></app-info-book>
                    <!-- Pager-->
                </div>
            </div>
        </div>
